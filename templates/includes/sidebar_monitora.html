<div class="sidebar">
    <div class="logo-section d-flex align-items-center gap-2">
        <div class="logo-icon"><i class="bi bi-bus-front"></i></div>
        <div class="logo-text">
            <h1>RutaEscolar</h1>
            <p>Panel Monitora</p>
        </div>
    </div>

    <nav class="nav-menu">

        <div class="nav-section-label">Principal</div>
        <a class="nav-item-custom {% if request.resolver_match.url_name == 'dashboard_monitora' %}active{% endif %}"
           href="{% url 'dashboard_monitora' %}">
            <i class="bi bi-grid-1x2"></i><span>Dashboard</span>
        </a>

        <div class="nav-section-label">Gestión</div>
        <a class="nav-item-custom {% if request.resolver_match.url_name == 'notificaciones' %}active{% endif %}"
           href="{% url 'notificaciones' %}">
            <i class="bi bi-bell"></i><span>Notificaciones</span>
            {% if notif_pendientes %}<span class="badge bg-danger ms-auto">{{ notif_pendientes }}</span>{% endif %}
        </a>

        <div class="nav-section-label">Cuenta</div>
        <a class="nav-item-custom {% if request.resolver_match.url_name == 'perfil' %}active{% endif %}"
           href="{% url 'perfil' %}">
            <i class="bi bi-person-circle"></i><span>Mi Perfil</span>
        </a>
        <form method="POST" action="{% url 'logout' %}" style="margin:0;padding:0;">
            {% csrf_token %}
            <button type="submit" class="nav-item-custom" style="color:#fca5a5;">
                <i class="bi bi-box-arrow-right"></i><span>Cerrar Sesión</span>
            </button>
        </form>

    </nav>

    <div class="sidebar-footer">
        <div class="d-flex align-items-center gap-2">
            <div class="user-avatar"><i class="bi bi-person-circle"></i></div>
            <div class="overflow-hidden">
                <p class="user-name text-truncate">{{ usuario_nombre|default:"Monitora" }}</p>
                <p class="user-role">MONITORA</p>
            </div>
        </div>
    </div>
</div>
